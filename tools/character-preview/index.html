<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Character preview – Dream House Builder</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #dfe3e8; font: 12px/1.3 system-ui, sans-serif; color: #222; }
      #gl { display: block; width: 100vw; height: 100vh; }
      .label { position: absolute; transform: translate(-50%, 0); padding: 2px 7px; border-radius: 9px; background: rgba(255, 255, 255, 0.82); white-space: nowrap; pointer-events: none; }
      #nav { position: absolute; left: 8px; top: 6px; display: flex; gap: 10px; flex-wrap: wrap; max-width: 96vw; }
      #nav a { color: #1d5fa8; text-decoration: none; background: rgba(255, 255, 255, 0.7); padding: 1px 6px; border-radius: 6px; }
      #info { position: absolute; right: 8px; bottom: 6px; background: rgba(255, 255, 255, 0.8); padding: 3px 8px; border-radius: 6px; white-space: pre; font-family: ui-monospace, monospace; font-size: 11px; }
    </style>
  </head>
  <body>
    <canvas id="gl"></canvas>
    <div id="nav"></div>
    <div id="info"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
